<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela com Nomes e Filmes</title>

    <style>

        table {
            width: 750px;
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
            border: 3px solid black;
        }

        thead {
            background-color: darkgrey;
            color: aliceblue;
            font-size: 1.3rem;
        }

        thead > tr > th {
            padding: 10px;
            border: 3px solid rgba(0, 0, 0, 0.322);
        }

        /* Primeiras 3 linhas em rosa */
        tbody > tr:nth-child(-n+3) > td {
        background-color: rgba(255, 192, 203, 0.548);
        }

        /* Próximas 3 linhas em azul */
        tbody > tr:nth-child(n+4):nth-child(-n+6) > td {
        background-color: rgba(173, 216, 230, 0.541);
        }

        td {
            padding: 10px;
            border: 1px solid darkgrey;
            text-align: center;
        }

        .mulher {
            background-color: rgba(255, 192, 203);
            border: 3px solid rgba(0, 0, 0, 0.322);
            color: aliceblue;
            font-size: 1.3rem;
        }

        .homem {
            background-color: rgba(173, 216, 230);
            border: 3px solid rgba(0, 0, 0, 0.322);
            color: aliceblue;
            font-size: 1.3rem;
        }


    </style>

</head>
<body>
    <table>
        <caption>Tabela de Filmes</caption>
        <thead>
            <tr>
                <th scope="col">Grupo</th>
                <th scope="col">Nomes</th>
                <th colspan="3" scope="colgroup">Filmes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="3" class="mulher" scope="rowgroup">Mulheres</th>
                <td>Ana Maria Santos</td>
                <td>Alien</td>
                <td>Rambo</td>
                <td>Vingadores</td>
            </tr>
            
            <tr>
                <td>Beatriz Souza</td>
                <td>Hulk</td>
                <td>Inception</td>
                <td>Batman</td>
            </tr>

            <tr>
                <td>Cláudia Melo</td>
                <td>Oblivion</td>
                <td>Matrix</td>
                <td>Big Hero</td>
            </tr>

            <tr>
                <th rowspan="3" class="homem" scope="rowgroup">Homens</th>
                <td>Bruno Mendonça</td>
                <td>Intocáveis</td>
                <td>Amnésia</td>
                <td>Gladiador</td>
            </tr>

            <tr>
                <td>Daniel Lourenço</td>
                <td>Wall-E</td>
                <td>OldBoy</td>
                <td>Dangal</td>
            </tr>

            <tr>
                <td>Fabiano Mota</td>
                <td>Star Wars 5</td>
                <td>Taxi Drive</td>
                <td>Toy Store</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
